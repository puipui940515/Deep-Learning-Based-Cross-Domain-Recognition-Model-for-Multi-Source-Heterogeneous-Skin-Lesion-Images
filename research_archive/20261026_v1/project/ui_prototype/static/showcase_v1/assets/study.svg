<!-- 【研究示意圖】自製抽象圖，非臨床影像。viewBox 定義 400×300 的繪圖座標。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<!-- 【可重用素材】pattern 是重複點狀紋理；radialGradient 是由中心往外變色的漸層，先定義後引用。 -->
<defs>
<pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="3" cy="5" r="1.2" fill="#a67e65" opacity=".13"/>
<circle cx="15" cy="17" r=".8" fill="#a67e65" opacity=".12"/>
</pattern>
<radialGradient id="b">
<stop stop-color="#ba8b72"/>
<stop offset="1" stop-color="#d8b299"/>
</radialGradient>
</defs>
<!-- 【背景】淡杏色圓角底板，再疊加點狀紋理。 -->
<rect width="400" height="300" rx="18" fill="#efe0cd"/>
<rect width="400" height="300" fill="url(#p)"/>
<!-- 【抽象圖形】三層有機輪廓與漸層組成示意，不代表分割遮罩或實際病灶定位。 -->
<path d="M134 74c25-22 65-33 96-12 26 18 41 26 49 57 8 34 22 63-2 88-19 20-50 19-78 26-31 8-51-4-70-27-16-20-34-36-29-65 4-29 13-48 34-67" fill="#e2c0a8"/>
<path d="M158 96c23-14 50-13 68 4 16 15 36 27 34 53-2 28-19 46-42 54-24 8-55-1-68-19-12-17-27-34-18-56 6-16 12-27 26-36" fill="url(#b)"/>
<path d="M166 116c18-11 40-8 51 7 12 16 24 25 17 42-8 21-36 25-52 14-20-13-37-33-16-63" fill="#a97b65" opacity=".45"/>
<!-- 【四角框線】裝飾性的影像觀察框，沒有偵測或裁切功能。 -->
<g fill="none" stroke="#79917b" stroke-width="1.4" opacity=".7">
<path d="M65 99V64h35M300 64h35v35M335 201v35h-35M100 236H65v-35"/>
</g>
<!-- 【中心十字】視覺構圖標記，不是模型關注區域。 -->
<path d="M191 150h18m-9-9v18" stroke="#fff9f0" opacity=".8" stroke-width="1.5"/>
</svg>
